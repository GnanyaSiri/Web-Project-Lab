name: CI and GitHub Pages Deployment

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All project files exist!"

      - name: Build website
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html style.css script.js dist/
          echo "Website build successful!"

      - name: Test website
        run: |
          grep -q 'style.css' index.html
          grep -q 'script.js' index.html
          grep -q '<footer>' index.html
          echo "All tests passed!"

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: deploy-to-github-pages
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5